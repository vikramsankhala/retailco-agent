[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailco-agent"
version = "1.0.0"
description = "RetailCo customer-support agent: a 13-layer reference build with Claude"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "claude-agent-sdk>=0.1",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["agent*", "evals*", "scripts*", "strategy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
